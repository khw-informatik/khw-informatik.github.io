<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Neuron-Simulator</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: Karopapier-Bühne mit dem Neuron, daneben (schmal: darunter) das Bedienfeld */
:root{
  --bg:#F3F5F0; --surface:#FFFFFF; --paper-line:rgba(52,86,110,.09); --line:#D6DCD6;
  --ink:#1C2830; --muted:#5B6870; --off:#9AA4AA;
  --neuron:#F6D664; --neuron-edge:#B48E18;
  --fire:#DD560C; --fire-soft:rgba(221,86,12,.13); --neg:#2B6BAF;
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --f-body:'Inter',system-ui,-apple-system,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121719; --surface:#1A2124; --paper-line:rgba(170,200,215,.07); --line:#2C363A;
    --ink:#E6ECEE; --muted:#9BA8AE; --off:#5E6A70;
    --neuron:#EBC955; --neuron-edge:#F4DA7E;
    --fire:#FF8642; --fire-soft:rgba(255,134,66,.16); --neg:#72AAEA;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121719; --surface:#1A2124; --paper-line:rgba(170,200,215,.07); --line:#2C363A;
  --ink:#E6ECEE; --muted:#9BA8AE; --off:#5E6A70;
  --neuron:#EBC955; --neuron-edge:#F4DA7E;
  --fire:#FF8642; --fire-soft:rgba(255,134,66,.16); --neg:#72AAEA;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding-block:28px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:20px}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(28px,4vw,40px);letter-spacing:-.01em;margin:0}
.main{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;align-items:start}
@media (max-width:900px){.main{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.stage{background-color:var(--surface);background-image:linear-gradient(var(--paper-line) 1px,transparent 1px),linear-gradient(90deg,var(--paper-line) 1px,transparent 1px);background-size:20px 20px;background-position:-1px -1px;overflow:hidden}
.stage svg{display:block;width:100%;height:auto}
.panel{padding:18px;display:grid;gap:20px;min-width:0}
.label{font-family:var(--f-display);font-weight:600;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.grid{display:grid;grid-template-columns:auto auto auto;align-items:center;justify-content:space-between;gap:8px 12px}
.grid .head{font-size:12px;color:var(--muted);text-align:center}
.grid .name{font-weight:600;white-space:nowrap}
.inline{display:flex;align-items:center;justify-content:space-between;gap:12px}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stepper button{border:0;background:transparent;color:var(--ink);font:600 18px var(--f-body);width:34px;height:34px;cursor:pointer}
.stepper button:hover{background:var(--fire-soft)}
.stepper input{width:54px;height:34px;border:0;border-left:1px solid var(--line);border-right:1px solid var(--line);background:transparent;color:var(--ink);font:700 15px var(--f-mono);text-align:center}
button:focus-visible,input:focus-visible{outline:2px solid var(--fire);outline-offset:2px}
.glow{opacity:0;transition:opacity .3s}
.firing .glow{opacity:.55;animation:throb 1.6s ease-in-out infinite}
@keyframes throb{0%,100%{opacity:.35}50%{opacity:.75}}
.sparks{opacity:0}
.firing .sparks{animation:burst 1.6s ease-out infinite}
@keyframes burst{0%{opacity:0;transform:scale(.7)}25%{opacity:1}70%{opacity:0;transform:scale(1.25)}100%{opacity:0;transform:scale(1.25)}}
@media (prefers-reduced-motion: reduce){
  .firing .glow{animation:none;opacity:.55}
  .firing .sparks{animation:none;opacity:1}
}
</style>

<div class="wrap">
  <h1>Neuron-Simulator</h1>

  <div class="main">
    <div class="card stage">
      <svg id="stage" viewBox="0 0 720 440" role="img" aria-label="Künstliches Neuron"></svg>
    </div>

    <div class="card panel">
      <div class="grid" id="rows"></div>
      <div class="inline">
        <span class="label">Anzahl Eingänge</span>
        <span class="stepper">
          <button id="nMinus" aria-label="Eingang entfernen">−</button>
          <input id="nVal" value="3" readonly aria-label="Anzahl Eingänge">
          <button id="nPlus" aria-label="Eingang hinzufügen">+</button>
        </span>
      </div>
      <div class="inline">
        <span class="label">Schwellenwert</span>
        <span class="stepper">
          <button id="tMinus" aria-label="Schwellenwert verringern">−</button>
          <input id="tVal" inputmode="decimal" aria-label="Schwellenwert">
          <button id="tPlus" aria-label="Schwellenwert erhöhen">+</button>
        </span>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  var MAX = 5;
  var S = { n:3, x:[1,1,0,0,0], w:[1,2,-1,1,1], theta:3 };
  var N = { x:380, y:205, r:64 };
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function fmt(v){ var r = Math.round(v*100)/100; return String(r).replace('.', ',').replace('-', '−'); }
  function clean(s){ return String(s).trim().replace(',', '.').replace('−','-'); }
  function parseNum(s){ var t = clean(s); if(!/^-?\d+(\.\d+)?$/.test(t)) return null; return Math.max(-999, Math.min(999, parseFloat(t))); }
  function parseInt10(s){ var t = clean(s); if(!/^-?\d+$/.test(t)) return null; return Math.max(-999, Math.min(999, parseInt(t, 10))); }
  function total(){ var s=0; for(var i=0;i<S.n;i++) s += S.x[i]*S.w[i]; return Math.round(s*1000)/1000; }

  /* ---------- Bühne ---------- */
  var svg = document.getElementById('stage');
  var segments = [];

  function inputYs(){
    if(S.n===1) return [N.y];
    var span = Math.min(290, (S.n-1)*100), ys=[];
    for(var i=0;i<S.n;i++) ys.push(N.y - span/2 + i*span/(S.n-1));
    return ys;
  }
  function marker(id, color){ return '<marker id="'+id+'" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:'+color+'"/></marker>'; }

  function renderStage(){
    var on = total() >= S.theta - 1e-9, ys = inputYs();
    var h = '<defs>' + marker('m-ink','var(--ink)') + marker('m-neg','var(--neg)') + marker('m-off','var(--off)') + marker('m-fire','var(--fire)') +
      '<filter id="blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="16"/></filter></defs>';
    segments = [];

    for(var i=0;i<S.n;i++){
      var ix=96, iy=ys[i], dx=N.x-ix, dy=N.y-iy, len=Math.hypot(dx,dy), ux=dx/len, uy=dy/len;
      var x1=ix+ux*28, y1=iy+uy*28, x2=N.x-ux*(N.r+6), y2=N.y-uy*(N.r+6);
      var w = S.w[i], col = w===0 ? 'var(--off)' : (w<0 ? 'var(--neg)' : 'var(--ink)'), mk = w===0 ? 'm-off' : (w<0 ? 'm-neg' : 'm-ink');
      var sw = w===0 ? 1.5 : Math.min(8, 1.6 + Math.abs(w)*1.1);
      var active = S.x[i] !== 0;
      h += '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" style="stroke:'+col+';stroke-width:'+sw+';opacity:'+(active?1:.32)+(w===0?';stroke-dasharray:6 6':'')+'" marker-end="url(#'+mk+')"/>';
      var px=x1+(x2-x1)*.36, py=y1+(y2-y1)*.36;
      h += '<text x="'+(px+uy*20)+'" y="'+(py-ux*20+8)+'" text-anchor="middle" style="font:700 24px var(--f-mono);fill:'+col+'">'+fmt(w)+'</text>';
      if(active && w!==0) segments.push({x1:x1,y1:y1,x2:x2,y2:y2,c:col,p:1.5});

      var label = fmt(S.x[i]), fs = label.length<=2 ? 22 : (label.length===3 ? 18 : 15);
      h += '<circle cx="96" cy="'+iy+'" r="26" style="fill:'+(active?'var(--ink)':'var(--surface)')+';stroke:var(--ink);stroke-width:2"/>' +
        '<text x="96" y="'+(iy+fs*0.36)+'" text-anchor="middle" style="font:700 '+fs+'px var(--f-mono);fill:'+(active?'var(--surface)':'var(--ink)')+'">'+label+'</text>';
    }

    // Schwellenwert von unten
    h += '<line x1="'+N.x+'" y1="396" x2="'+N.x+'" y2="'+(N.y+N.r+6)+'" style="stroke:var(--ink);stroke-width:2.5" marker-end="url(#m-ink)"/>';
    h += '<text x="'+N.x+'" y="428" text-anchor="middle" style="font:700 24px var(--f-mono);fill:var(--ink)">'+fmt(S.theta)+'</text>';

    // Ausgang
    var oc = on ? 'var(--fire)' : 'var(--off)';
    h += '<line x1="'+(N.x+N.r+6)+'" y1="'+N.y+'" x2="600" y2="'+N.y+'" style="stroke:'+oc+';stroke-width:'+(on?4:2)+(on?'':';stroke-dasharray:7 7')+'" marker-end="url(#'+(on?'m-fire':'m-off')+')"/>';
    if(on) segments.push({x1:N.x+N.r+6,y1:N.y,x2:600,y2:N.y,c:'var(--fire)',p:.9,big:true});

    // Neuron
    h += '<g class="'+(on?'firing':'')+'">';
    h += '<circle class="glow" cx="'+N.x+'" cy="'+N.y+'" r="'+(N.r+14)+'" filter="url(#blur)" style="fill:var(--fire)"/>';
    h += '<circle cx="'+N.x+'" cy="'+N.y+'" r="'+N.r+'" style="fill:var(--neuron);stroke:var(--neuron-edge);stroke-width:2.5"/>';
    var cx=634, rays='';
    for(var k=0;k<8;k++){ var a=k*Math.PI/4+Math.PI/8;
      rays += '<line x1="'+(cx+Math.cos(a)*36)+'" y1="'+(N.y+Math.sin(a)*36)+'" x2="'+(cx+Math.cos(a)*50)+'" y2="'+(N.y+Math.sin(a)*50)+'"/>'; }
    h += '<g class="sparks" style="stroke:var(--fire);stroke-width:3;stroke-linecap:round;transform-box:view-box;transform-origin:'+cx+'px '+N.y+'px">'+rays+'</g>';
    h += '<circle cx="'+cx+'" cy="'+N.y+'" r="26" style="fill:'+(on?'var(--fire)':'var(--surface)')+';stroke:'+oc+';stroke-width:2.5"/>';
    h += '<text x="'+cx+'" y="'+(N.y+8)+'" text-anchor="middle" style="font:700 22px var(--f-mono);fill:'+(on?'#FFFFFF':'var(--muted)')+'">'+(on?1:0)+'</text>';
    h += '</g>';

    h += '<text x="522" y="'+(N.y-30)+'" text-anchor="middle" style="font:800 27px var(--f-display);fill:'+(on?'var(--fire)':'var(--off)')+'">'+(on?'Feuert!':'Feuert nicht')+'</text>';
    h += '<g id="pulses"></g>';
    svg.innerHTML = h;
    svg.setAttribute('aria-label', 'Künstliches Neuron: ' + (on ? 'feuert' : 'feuert nicht'));

    var pg = svg.querySelector('#pulses');
    segments.forEach(function(sg){
      sg.dots = [];
      for(var d=0; d<2; d++){
        var c = document.createElementNS('http://www.w3.org/2000/svg','circle');
        c.setAttribute('r', sg.big ? 7 : 5.5);
        c.setAttribute('style','fill:'+sg.c);
        pg.appendChild(c); sg.dots.push(c);
      }
    });
    placePulses(performance.now());
  }

  function placePulses(now){
    segments.forEach(function(sg){
      sg.dots.forEach(function(c, d){
        var t = reduce ? (d===0 ? .35 : .7) : ((now/1000/sg.p + d/2) % 1);
        c.setAttribute('cx', sg.x1 + (sg.x2-sg.x1)*t);
        c.setAttribute('cy', sg.y1 + (sg.y2-sg.y1)*t);
        c.style.opacity = reduce ? 1 : Math.min(1, Math.min(t, 1-t)*6);
      });
    });
  }
  if(!reduce){ (function loop(now){ placePulses(now); requestAnimationFrame(loop); })(performance.now()); }

  /* ---------- Bedienfeld ---------- */
  function stepper(kind, i, value, label){
    return '<span class="stepper">' +
      '<button data-k="'+kind+'" data-i="'+i+'" data-d="-1" aria-label="'+label+' verringern">−</button>' +
      '<input id="'+kind+i+'" data-k="'+kind+'" data-i="'+i+'" inputmode="'+(kind==='x'?'numeric':'decimal')+'" value="'+fmt(value)+'" aria-label="'+label+'">' +
      '<button data-k="'+kind+'" data-i="'+i+'" data-d="1" aria-label="'+label+' erhöhen">+</button></span>';
  }
  function renderRows(){
    var r = document.getElementById('rows');
    var h = '<span></span><span class="head">Eingabewert</span><span class="head">Gewicht</span>';
    for(var i=0;i<S.n;i++){
      h += '<span class="name">Eingang '+(i+1)+'</span>' + stepper('x', i, S.x[i], 'Eingabewert '+(i+1)) + stepper('w', i, S.w[i], 'Gewicht '+(i+1));
    }
    r.innerHTML = h;
    r.querySelectorAll('button[data-k]').forEach(function(b){
      b.addEventListener('click', function(){
        var arr = S[b.dataset.k], i = +b.dataset.i;
        arr[i] = Math.max(-999, Math.min(999, Math.round((arr[i] + +b.dataset.d)*100)/100));
        render();
      });
    });
    r.querySelectorAll('input[data-k]').forEach(function(inp){
      var k = inp.dataset.k, i = +inp.dataset.i;
      inp.addEventListener('input', function(){ var v = k==='x' ? parseInt10(inp.value) : parseNum(inp.value); if(v!==null){ S[k][i]=v; renderStage(); } });
      inp.addEventListener('blur', function(){ inp.value = fmt(S[k][i]); });
    });
  }

  var tVal = document.getElementById('tVal'), nVal = document.getElementById('nVal');
  document.getElementById('tMinus').addEventListener('click', function(){ S.theta = Math.max(-999, Math.round((S.theta-1)*100)/100); render(); });
  document.getElementById('tPlus').addEventListener('click', function(){ S.theta = Math.min(999, Math.round((S.theta+1)*100)/100); render(); });
  tVal.addEventListener('input', function(){ var v=parseNum(tVal.value); if(v!==null){ S.theta=v; renderStage(); } });
  tVal.addEventListener('blur', function(){ tVal.value = fmt(S.theta); });
  document.getElementById('nMinus').addEventListener('click', function(){ if(S.n>1){ S.n--; render(); } });
  document.getElementById('nPlus').addEventListener('click', function(){ if(S.n<MAX){ S.n++; render(); } });

  function render(){ renderRows(); tVal.value = fmt(S.theta); nVal.value = S.n; renderStage(); }
  render();
})();
</script>

</body></html>
